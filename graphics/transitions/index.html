<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>BOS Custom Broadcast Transition</title>
  <link rel="stylesheet" href="transition.css">
</head>
<body>
  <div id="transition-container" class="transition-container hidden">
    <!-- Sliding Panels / Diagonal Wipe -->
    <div class="transition-wipe-left" id="wipe-left"></div>
    <div class="transition-wipe-right" id="wipe-right"></div>

    <!-- Center Stinger Card -->
    <div class="transition-center-badge" id="center-badge">
      <div class="badge-logo-mark">BOS</div>
      <div class="badge-title" id="badge-title">REPLAY</div>
      <div class="badge-stripe" id="badge-stripe"></div>
    </div>
  </div>

  <script src="transition.js"></script>
</body>
</html>
