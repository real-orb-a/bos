<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>BOS Goal Animation</title>
  <link rel="stylesheet" href="goal.css">
</head>
<body>
  <div id="goal-container" class="goal-container hidden">
    <div class="goal-backdrop"></div>
    <div class="light-ray light-ray-1"></div>
    <div class="light-ray light-ray-2"></div>
    
    <div class="goal-card" id="goal-card">
      <div class="team-stripe" id="team-stripe"></div>
      <div class="goal-content">
        <div class="goal-header">
          <span class="team-title" id="team-title">GARNET</span>
          <span class="goal-badge">GOAL!</span>
        </div>
        <div class="goal-main-text">GOAL!</div>
        <div class="goal-details">
          <span class="player-name" id="player-name">OFFICIAL MATCH EVENT</span>
          <span class="score-tag" id="score-tag">SCORE 1</span>
        </div>
      </div>
    </div>
  </div>

  <script src="goal.js"></script>
</body>
</html>
