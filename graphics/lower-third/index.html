<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>BOS Lower Third</title>
  <link rel="stylesheet" href="lower-third.css">
</head>
<body>
  <!-- F1 broadcast-style lower third: skewed dark banner, accent title,
       small caps subtitle and a right-hand highlight block (label + value). -->
  <div id="lower-third" class="lower-third hidden bottom-left">
    <div class="lt-banner">
      <div class="lt-accent" id="lt-accent"></div>
      <div class="lt-content">
        <div class="lt-text">
          <h2 class="lt-title" id="lt-title">UNDER REVIEW</h2>
          <p class="lt-subtitle" id="lt-subtitle">DECISION PENDING</p>
        </div>
        <div class="lt-side">
          <span class="lt-side-label" id="badge-text">BROADCAST</span>
          <span class="lt-side-value" id="lt-value"></span>
        </div>
      </div>
    </div>
  </div>

  <script src="lower-third.js"></script>
</body>
</html>
